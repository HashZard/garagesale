name: 质量检查

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 启动并重置本地 Supabase
        run: |
          pnpm db:start
          pnpm db:reset
          pnpm db:lint

      - name: 导出本地测试环境变量
        run: |
          STATUS="$(pnpm exec supabase status -o json)"
          echo "DEPLOYMENT_ENV=local" >> "$GITHUB_ENV"
          echo "EMAIL_DELIVERY_MODE=preview" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SITE_URL=http://127.0.0.1:3000" >> "$GITHUB_ENV"
          echo "SUPABASE_URL=$(jq -r .API_URL <<< "$STATUS")" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SUPABASE_URL=$(jq -r .API_URL <<< "$STATUS")" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$(jq -r .ANON_KEY <<< "$STATUS")" >> "$GITHUB_ENV"
          echo "SUPABASE_SERVICE_ROLE_KEY=$(jq -r .SERVICE_ROLE_KEY <<< "$STATUS")" >> "$GITHUB_ENV"

      - name: 检查生成数据库类型
        run: |
          pnpm db:types
          git diff --exit-code -- src/types/database.generated.ts

      - name: 执行代码和 Next.js 检查
        run: pnpm check

      - name: 构建 Cloudflare Worker
        run: pnpm build:worker

      - name: 审计高危依赖
        run: pnpm audit --audit-level=high

      - name: 安装端到端测试浏览器
        run: pnpm exec playwright install --with-deps chromium

      - name: 执行端到端测试
        run: pnpm test:e2e
